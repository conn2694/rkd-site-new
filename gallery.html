<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/gallery.js"></script>
<title>Gallery</title>
<style>

body {
  background-color: rgb(255, 231, 235);
}

.site-header {
  float: left;
  width: 100%;
  text-align: center;
  background-color: #8a99ec;
  border-radius: 2px;
  padding: 10px;
}

.logo {
  float: left;
  width: 100%;
  text-align: left;
  background-color: #ef8181;
  border-radius: 2px;
  padding: 10px;
}

.links {
  float: left;
  width: 100%;
  text-align: center;
  background-color: #a4a5d8;
  border-radius: 2px;
  padding: 10px;
}

.socials {
  float: left;
  width: 100%;
  text-align: center;
  background-color: #f0b793;
  border-radius: 2px;
  padding: 10px;
}

.bonus {
  float: left;
  width: 100%;
  text-align: center;
  background-color: #abebb6;
  border-radius: 2px;
  padding: 10px;
}

.art {
  float: right;
  text-align: center;
  width: 100%;
  border-radius: 2px;
  padding: 10px;
  background-color: #cea4d8;
}

/* ---------- Gallery ---------- */

/* Square thumbnails, cropped to fill; the full image shows when enlarged */
.gallery-thumb {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: none;
  border-radius: 4px;
  overflow: hidden;
  background: #fff;
  cursor: zoom-in;
}

.gallery-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.25s ease;
}

.gallery-thumb:hover img,
.gallery-thumb:focus-visible img {
  transform: scale(1.05);
}

/* Darker dim than Bootstrap's default backdrop */
.modal-backdrop.show {
  opacity: 0.85;
}

#lightbox .modal-content {
  background: transparent;
  border: none;
}

#lightbox .modal-body {
  position: relative;
  text-align: center;
  padding: 0;
}

#lightbox-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 4px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}

#lightbox-title {
  color: #fff;
  margin-top: 0.75rem;
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 3rem;
  height: 3rem;
  border: none;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.45);
  color: #fff;
  font-size: 1.5rem;
  line-height: 1;
}

.lightbox-nav:hover {
  background: rgba(0, 0, 0, 0.7);
}

#lightbox-prev { left: 0.5rem; }
#lightbox-next { right: 0.5rem; }

#lightbox .btn-close {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 1;
}

</style>
</head>

<body>

  <!-- Mobile layout -->
  <div class="container-sm px-5 d-md-none">
    <div class="row mb-2">
      <div class="site-header">
      <h1>Header</h1>
      </div>
    </div>
    <div class="row">
      <div class="col-9">
        <div class="row mb-2">

      </div>
      <div class="col">

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasTop" aria-labelledby="offcanvasTopLabel" style="background-color: #cea4d8;">
  <div class="offcanvas-header">
    <h5 id="offcanvasTopLabel">Menu</h5>
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <a href="#">About Me<br></a>
      <a href="#">Commissions<br></a>
      <a href="gallery.html">Gallery<br></a>
    </div>
    </div>
    </div>
  </div>

    </div>
    <div class="row mb-2">
      <div class="art">
        <h2>Gallery</h2>
        <div class="row row-cols-2 row-cols-sm-3 g-2 gallery-grid"></div>
      </div>
    </div>
    <div class="row">
      <div class="col mb-2">

          <div class="socials" >

            <a href="#">Twitter<br></a>

          </div>
        </div>
      </div>
      <div class="col ms-2 mb-2">
        <div class="row">
          <div class="bonus">
            <h2>Bonus</h2>
          </div>
        </div>
      </div>
    </div>
    <div class="row p-2" style="background-color:#ef8181;"><h5>Footer</h5></div>
  </div>

  <!-- Desktop layout -->
  <div class="container px-5 d-none d-sm-none d-md-block">
    <div class="row mb-2">
      <div class="site-header">
      <h1>Header</h1>
      </div>
    </div>
    <div class="row mb-2">
      <div class="logo">
      <h5>Logo   Illustrator</h5>
    </div>
    </div>
    <div class="row">
      <div class="col-3">
        <div class="row mb-2">
        <div class="links">
          <h2>Menu</h2>
          <a href="#">About Me<br></a>
          <a href="#">Commissions<br></a>
          <a href="gallery.html">Gallery<br></a>
        </div>
        </div>
        <div class="row mb-2">
          <div class="socials" >
      <h2>Socials</h2>
      <a href="#">Twitter<br></a>

    </div>
   </div>

      </div>

  <!-- Lightbox: enlarged image over a dimmed background -->
  <div class="modal fade" id="lightbox" tabindex="-1" aria-labelledby="lightbox-title" aria-hidden="true">
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div class="modal-body">
          <img id="lightbox-img" src="" alt="">
          <h5 id="lightbox-title"></h5>
          <button type="button" class="lightbox-nav" id="lightbox-prev" aria-label="Previous image">&#8249;</button>
          <button type="button" class="lightbox-nav" id="lightbox-next" aria-label="Next image">&#8250;</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
